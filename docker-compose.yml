version: '3.8'

services:
  backend:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
    volumes:
      - .:/app:cached

  frontend:
    build: .
    command: streamlit run app.py --server.address 0.0.0.0 --server.port 7860 --server.headless true
    ports:
      - "7860:7860"
    environment:
      API_BASE_URL: http://backend:8000
      GROQ_API_KEY: ${GROQ_API_KEY}
    depends_on:
      - backend
    volumes:
      - .:/app:cached
